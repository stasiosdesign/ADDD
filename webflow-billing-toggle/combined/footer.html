<script>
(() => {
  function init() {
    const page = document.documentElement;
    if (page.hasAttribute('data-billing-tabs-ready')) return;
    page.setAttribute('data-billing-tabs-ready', '');

    const gsap = window.gsap;
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const tabInstances = [];
    const billingRoot = '[data-toggle-init][data-billing="toggle"]';
    const tabRoot = '[data-bouncy-tabs-init]';
    const duration = value => motion.matches ? 0 : value;
    let id = 0;
    let frame = 0;

    function uniqueId(prefix) {
      let value;
      do { value = `${prefix}-${++id}`; } while (document.getElementById(value));
      return value;
    }

    // Find only elements owned by this component, excluding nested components.
    function owned(root, selector, boundary) {
      return [...root.querySelectorAll(selector)].filter(
        element => element.closest(boundary) === root
      );
    }

    function keyIndex(event, index, count, wrap) {
      let next;
      if (event.key === 'ArrowRight') next = index + 1;
      else if (event.key === 'ArrowLeft') next = index - 1;
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = count - 1;
      else return null;
      event.preventDefault();
      event.stopPropagation();
      return wrap ? (next + count) % count : Math.max(0, Math.min(count - 1, next));
    }

    function refreshTabs() {
      if (frame) return;
      frame = requestAnimationFrame(() => {
        frame = 0;
        tabInstances.forEach(instance => instance.refresh());
      });
    }

    /* BILLING: one page-wide selection, with Osmo's CSS sliding pill. */
    const controls = [...document.querySelectorAll(billingRoot)].map(toggle => ({
      toggle,
      buttons: owned(toggle, 'button[data-toggle-btn]', billingRoot)
    })).filter(({ buttons }) => {
      return buttons.length === 2 &&
        buttons.some(button => button.dataset.toggleBtn === 'annual') &&
        buttons.some(button => button.dataset.toggleBtn === 'quarterly');
    });

    const priceGroups = [...document.querySelectorAll(
      '[data-billing="annual"], [data-billing="quarterly"]'
    )];
    let cycle = 'annual';
    let status;

    if (controls.length) {
      status = document.createElement('div');
      status.setAttribute('role', 'status');
      status.setAttribute('aria-atomic', 'true');
      status.style.cssText = 'position:absolute;width:1px;height:1px;' +
        'padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);' +
        'white-space:nowrap;border:0;';
      document.body.append(status);
    }

    function renderBilling() {
      page.setAttribute('data-billing-cycle', cycle);
      controls.forEach(({ toggle, buttons }) => {
        const selected = buttons.findIndex(button => button.dataset.toggleBtn === cycle);
        toggle.style.setProperty('--toggle-active', selected);
        buttons.forEach((button, index) => {
          const active = index === selected;
          button.toggleAttribute('data-toggle-active', active);
          button.setAttribute('aria-pressed', String(active));
          button.tabIndex = active ? 0 : -1;
        });
      });
      priceGroups.forEach(group => {
        const inactive = group.dataset.billing !== cycle;
        group.inert = inactive;
        group.setAttribute('aria-hidden', String(inactive));
      });
    }

    function selectBilling(next) {
      if (next === cycle) return;
      cycle = next;
      renderBilling();
      if (status) status.textContent = cycle === 'annual'
        ? 'All prices are per month, billed annually.'
        : 'All prices are per month, billed quarterly.';
      refreshTabs();
    }

    controls.forEach(({ toggle, buttons }) => {
      toggle.style.setProperty('--toggle-count', buttons.length);
      toggle.setAttribute('role', 'group');
      if (!toggle.hasAttribute('aria-label') && !toggle.hasAttribute('aria-labelledby')) {
        toggle.setAttribute('aria-label', 'Billing period');
      }
      buttons.forEach((button, index) => {
        button.type = 'button';
        button.addEventListener('click', () => selectBilling(button.dataset.toggleBtn));
        button.addEventListener('keydown', event => {
          const next = keyIndex(event, index, buttons.length, true);
          if (next === null) return;
          selectBilling(buttons[next].dataset.toggleBtn);
          buttons[next].focus();
        });
      });
    });
    renderBilling();

    /* BOUNCY TABS: original timings, indicator, hover ghost and stagger. */
    const config = {
      travel: 0.45, travelEase: 'power3.inOut', height: 0.4,
      contentOut: 0.38, contentOutShift: 3, contentOutStagger: 0.03,
      contentIn: 0.45, contentInShift: 8, contentStagger: 0.05,
      contentOverlap: 0.2, ghost: 0.3
    };

    if (!gsap && document.querySelector(tabRoot)) {
      console.warn('Billing + Tabs: load GSAP before this script for Bouncy Tabs animation. Tabs will still switch without animation.');
    }

    document.querySelectorAll(tabRoot).forEach(root => {
      const find = selector => owned(root, selector, tabRoot)[0];
      const nav = find('[data-bouncy-tabs-nav]');
      const indicator = find('[data-bouncy-tabs-indicator]');
      const ghost = find('[data-bouncy-tabs-ghost]');
      const wrap = find('[data-bouncy-tabs-panels]');
      const buttons = nav ? owned(root, '[data-bouncy-tabs-button]', tabRoot)
        .filter(button => nav.contains(button)) : [];
      const panels = wrap ? owned(root, '[data-bouncy-tabs-panel]', tabRoot)
        .filter(panel => wrap.contains(panel)) : [];
      if (!nav || !indicator || buttons.length < 2) return;
      if (panels.length && panels.length !== buttons.length) {
        console.warn('Billing + Tabs: a Bouncy Tabs component needs one panel per button.', root);
        return;
      }

      let active = Math.max(0, buttons.findIndex(button => button.hasAttribute('data-active')));
      let timeline = null;
      let ghostVisible = false;

      // Never let a tab item tween overwrite billing opacity or pill movement.
      function safeItem(element) {
        return !element.closest('[data-billing], [data-toggle-init]');
      }

      function itemsIn(panel) {
        const tagged = [...panel.querySelectorAll('[data-bouncy-tabs-item]')]
          .filter(element => element.closest(tabRoot) === root &&
            element.closest('[data-bouncy-tabs-panel]') === panel);
        const candidates = tagged.length ? tagged.flatMap(element =>
          element.getAttribute('data-bouncy-tabs-item') === 'children'
            ? [...element.children] : [element]
        ) : [...panel.children];
        const safe = [...new Set(candidates)].filter(safeItem);
        // Avoid animating a parent and its children twice.
        return safe.filter(element => !safe.some(other =>
          other !== element && other.contains(element)
        ));
      }
      const items = panels.map(itemsIn);

      function panelState() {
        buttons.forEach((button, index) => {
          const selected = index === active;
          button.toggleAttribute('data-active', selected);
          button.setAttribute('aria-selected', String(selected));
          button.tabIndex = selected ? 0 : -1;
        });
        panels.forEach((panel, index) => {
          const selected = index === active;
          panel.toggleAttribute('data-active', selected);
          panel.inert = !selected;
          panel.setAttribute('aria-hidden', String(!selected));
        });
      }

      function boxFor(button) {
        return {
          x: button.offsetLeft, y: button.offsetTop,
          width: button.offsetWidth, height: button.offsetHeight
        };
      }

      function placeIndicator(animate = false) {
        const box = boxFor(buttons[active]);
        if (gsap) {
          gsap.killTweensOf(indicator);
          if (animate) gsap.to(indicator, {
            ...box, duration: duration(config.travel), ease: config.travelEase,
            onComplete: refreshTabs
          });
          else gsap.set(indicator, box);
        } else {
          Object.assign(indicator.style, {
            transform: `translate(${box.x}px, ${box.y}px)`,
            width: `${box.width}px`, height: `${box.height}px`
          });
        }
      }

      function setHeight() {
        if (!panels.length) return;
        const height = panels[active].offsetHeight;
        if (gsap) gsap.set(wrap, { height });
        else wrap.style.height = `${height}px`;
      }

      function stopPanels() {
        if (timeline) timeline.kill();
        timeline = null;
        if (gsap && panels.length) gsap.killTweensOf([wrap, ...panels, ...items.flat()]);
      }

      function settlePanels() {
        stopPanels();
        panels.forEach((panel, index) => {
          if (gsap) {
            gsap.set(panel, { autoAlpha: index === active ? 1 : 0 });
            if (items[index].length) gsap.set(items[index], { autoAlpha: 1, clearProps: 'transform' });
          } else {
            panel.style.opacity = index === active ? '1' : '0';
            panel.style.visibility = index === active ? 'visible' : 'hidden';
          }
        });
        setHeight();
      }

      function transitionPanels(previous) {
        if (!panels.length) return;
        stopPanels();
        if (!gsap || motion.matches) { settlePanels(); return; }

        const incoming = panels[active];
        const outgoing = panels[previous];
        panels.forEach((panel, index) => {
          gsap.set(panel, { autoAlpha: index === previous ? 1 : 0 });
          if (index !== previous && items[index].length) {
            gsap.set(items[index], { autoAlpha: 1, clearProps: 'transform' });
          }
        });

        timeline = gsap.timeline({ onComplete: () => {
          timeline = null;
          refreshTabs();
        }});

        if (items[previous].length) {
          timeline.to(items[previous], {
            autoAlpha: 0, y: -config.contentOutShift,
            duration: config.contentOut, ease: 'power1.inOut',
            stagger: config.contentOutStagger
          }, 0);
        } else {
          timeline.to(outgoing, { autoAlpha: 0, duration: config.contentOut }, 0);
        }

        timeline.to(wrap, {
          height: incoming.offsetHeight, duration: config.height, ease: config.travelEase
        }, 0);

        if (items[active].length) {
          timeline.set(incoming, { autoAlpha: 1 }, config.contentOverlap)
            .fromTo(items[active], { autoAlpha: 0, y: config.contentInShift }, {
              autoAlpha: 1, y: 0, duration: config.contentIn, ease: 'power2.out',
              stagger: config.contentStagger, clearProps: 'transform'
            }, config.contentOverlap);
        } else {
          timeline.to(incoming, { autoAlpha: 1, duration: config.contentIn }, config.contentOverlap);
        }

        timeline.set(outgoing, { autoAlpha: 0 });
        if (items[previous].length) {
          timeline.set(items[previous], { autoAlpha: 1, clearProps: 'transform' });
        }
      }

      function goTo(index) {
        if (index === active) return;
        const previous = active;
        active = index;
        panelState();
        placeIndicator(true);
        transitionPanels(previous);
        refreshTabs();
      }

      function moveGhost(button) {
        if (!ghost || !gsap) return;
        const box = boxFor(button);
        gsap.killTweensOf(ghost);
        if (!ghostVisible) {
          gsap.set(ghost, box);
          gsap.to(ghost, { autoAlpha: 1, duration: duration(0.2), ease: 'power2.out' });
        } else {
          gsap.to(ghost, { ...box, autoAlpha: 1, duration: duration(config.ghost), ease: config.travelEase });
        }
        ghostVisible = true;
      }

      function hideGhost() {
        ghostVisible = false;
        if (ghost && gsap) {
          gsap.killTweensOf(ghost);
          gsap.to(ghost, { autoAlpha: 0, duration: duration(0.2), ease: 'power1.out' });
        }
      }

      if (panels.length) nav.setAttribute('role', 'tablist');
      buttons.forEach((button, index) => {
        if (button.tagName === 'BUTTON') button.type = 'button';
        if (panels[index]) {
          const panel = panels[index];
          button.id ||= uniqueId('bouncy-tab');
          panel.id ||= uniqueId('bouncy-panel');
          button.setAttribute('role', 'tab');
          button.setAttribute('aria-controls', panel.id);
          panel.setAttribute('role', 'tabpanel');
          panel.setAttribute('aria-labelledby', button.id);
        }
        button.addEventListener('click', event => { event.preventDefault(); goTo(index); });
        button.addEventListener('mouseenter', () => moveGhost(button));
        button.addEventListener('keydown', event => {
          if (event.target.closest('[data-bouncy-tabs-button]') !== button) return;
          if (button.tagName !== 'BUTTON' && (event.key === 'Enter' || event.key === ' ')) {
            event.preventDefault();
            event.stopPropagation();
            goTo(index);
            return;
          }
          const next = keyIndex(event, index, buttons.length, false);
          if (next === null) return;
          goTo(next);
          buttons[next].focus();
        });
      });
      nav.addEventListener('mouseleave', hideGhost);
      if (ghost) {
        if (gsap) gsap.set(ghost, { autoAlpha: 0 });
        else ghost.style.visibility = 'hidden';
      }

      const instance = {
        refresh() {
          nav.toggleAttribute('data-wrapped', new Set(buttons.map(button => button.offsetTop)).size > 1);
          // Do not interrupt an in-flight indicator or panel animation.
          if (!gsap || !gsap.isTweening(indicator)) placeIndicator();
          if (!timeline) setHeight();
        },
        settle() { hideGhost(); placeIndicator(); settlePanels(); }
      };
      tabInstances.push(instance);
      panelState();
      settlePanels();
      instance.refresh();

      if ('ResizeObserver' in window) {
        const observer = new ResizeObserver(refreshTabs);
        [nav, ...buttons, ...panels].forEach(element => observer.observe(element));
      }
    });

    window.addEventListener('resize', refreshTabs);
    if (document.fonts) document.fonts.ready.then(refreshTabs);
    motion.addEventListener('change', () => tabInstances.forEach(instance => instance.settle()));
    window.addEventListener('pageshow', () => {
      renderBilling();
      refreshTabs();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>
