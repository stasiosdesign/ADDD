<style>
/* Annual billing is the default, including before JavaScript loads. */
:root {
  --billing-fade: 200ms;
  --billing-muted-opacity: 0.5;
}

/* Both groups occupy one grid cell. The taller group reserves the height. */
[data-billing-stack] {
  display: grid;
}

[data-billing-stack] > [data-billing-content] {
  grid-area: 1 / 1;
  min-width: 0;
  align-self: start;
}

[data-billing-content] {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity var(--billing-fade) ease,
              visibility 0s linear var(--billing-fade);
}

:root:not([data-billing-cycle="quarterly"]) [data-billing-content="annual"],
:root[data-billing-cycle="quarterly"] [data-billing-content="quarterly"] {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition-delay: 0s;
}

[data-billing-label] {
  opacity: var(--billing-muted-opacity);
  transition: opacity var(--billing-fade) ease;
}

:root:not([data-billing-cycle="quarterly"]) [data-billing-label="annual"],
:root[data-billing-cycle="quarterly"] [data-billing-label="quarterly"] {
  opacity: 1;
}

/* Keep the supplied switch classes; put the two labels outside this wrapper. */
.btn-toggle {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  min-width: 44px;
  min-height: 44px;
  cursor: pointer;
  font-size: 24px;
}

.btn-toggle__toggle {
  display: flex;
  flex-shrink: 0;
  width: 2em;
  height: 1.25em;
  border-radius: 2em;
  background: #ff4c24;
  pointer-events: none;
}

.btn-toggle__toggle-dot {
  width: 1em;
  height: 1em;
  margin-top: 0.125em;
  margin-left: 0.125em;
  border-radius: 50%;
  background: #fff;
  transform: translateX(0);
  transition: transform 320ms cubic-bezier(0.35, 1, 0.6, 1);
}

:root[data-billing-cycle="quarterly"] .btn-toggle__toggle-dot {
  transform: translateX(0.75em);
}

.btn-toggle__checkbox[data-billing-toggle] {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.btn-toggle:has([data-billing-toggle]:focus-visible) .btn-toggle__toggle {
  outline: 2px solid currentColor;
  outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {
  [data-billing-content],
  [data-billing-label],
  .btn-toggle__toggle-dot {
    transition: none;
  }
}
</style>
