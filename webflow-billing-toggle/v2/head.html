<style>
:root {
  --billing-fade: 200ms;
  --billing-muted: 0.5;
  --billing-travel: 0.75em;
}

/* Keep the original track and dot styling in Webflow. */
[data-billing="toggle"] {
  position: relative;
}

[data-billing="toggle"] input[type="checkbox"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  z-index: 1;
  cursor: pointer;
}

[data-billing="toggle"]:has(input:focus-visible) {
  outline: 2px solid currentColor;
  outline-offset: 4px;
  border-radius: 2em;
}

[data-billing="dot"] {
  transform: translateX(0);
  transition: transform 320ms cubic-bezier(0.35, 1, 0.6, 1);
}

[data-billing="toggle"]:has(input:checked) [data-billing="dot"] {
  transform: translateX(var(--billing-travel));
}

[data-billing="label-annual"],
[data-billing="label-quarterly"] {
  opacity: var(--billing-muted);
  transition: opacity var(--billing-fade) ease;
}

html:not([data-billing-cycle="quarterly"]) [data-billing="label-annual"],
html[data-billing-cycle="quarterly"] [data-billing="label-quarterly"] {
  opacity: 1;
}

[data-billing="prices"] {
  display: grid;
}

[data-billing="prices"] > [data-billing="annual"],
[data-billing="prices"] > [data-billing="quarterly"] {
  grid-area: 1 / 1;
  min-width: 0;
  align-self: start;
}

[data-billing="annual"],
[data-billing="quarterly"] {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity var(--billing-fade) ease,
              visibility 0s linear var(--billing-fade);
}

html:not([data-billing-cycle="quarterly"]) [data-billing="annual"],
html[data-billing-cycle="quarterly"] [data-billing="quarterly"] {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition-delay: 0s;
}

@media (prefers-reduced-motion: reduce) {
  [data-billing="dot"],
  [data-billing="label-annual"],
  [data-billing="label-quarterly"],
  [data-billing="annual"],
  [data-billing="quarterly"] {
    transition: none;
  }
}
</style>
