<script>
(() => {
  function init() {
    const root = document.documentElement;
    const selector = '[data-billing="toggle"] input[type="checkbox"]';
    const toggles = [...document.querySelectorAll(selector)];
    if (!toggles.length || root.hasAttribute('data-billing-ready')) return;
    root.setAttribute('data-billing-ready', '');

    const groups = document.querySelectorAll(
      '[data-billing="annual"], [data-billing="quarterly"]'
    );
    let quarterly = false;

    const status = document.createElement('div');
    status.setAttribute('role', 'status');
    status.setAttribute('aria-atomic', 'true');
    status.style.cssText = 'position:absolute;width:1px;height:1px;' +
      'padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);' +
      'white-space:nowrap;border:0;';
    document.body.append(status);

    toggles.forEach(input => {
      input.defaultChecked = false;
      input.setAttribute('role', 'switch');
      if (!input.hasAttribute('aria-label') && !input.hasAttribute('aria-labelledby')) {
        input.setAttribute('aria-label', 'Quarterly billing');
      }
    });

    function render(announce = false) {
      const cycle = quarterly ? 'quarterly' : 'annual';
      root.setAttribute('data-billing-cycle', cycle);
      toggles.forEach(input => { input.checked = quarterly; });
      groups.forEach(group => {
        const inactive = group.getAttribute('data-billing') !== cycle;
        group.inert = inactive;
        group.setAttribute('aria-hidden', String(inactive));
      });
      if (announce) {
        status.textContent = quarterly
          ? 'All prices are per month, billed quarterly.'
          : 'All prices are per month, billed annually.';
      }
    }

    document.addEventListener('change', event => {
      if (!toggles.includes(event.target)) return;
      quarterly = event.target.checked;
      render(true);
    });

    window.addEventListener('pageshow', () => render());
    document.addEventListener('reset', () => setTimeout(() => render(), 0));
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>
