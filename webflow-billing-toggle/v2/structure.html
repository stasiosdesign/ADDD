<div class="billing-control">
  <p data-billing="label-annual">Yearly</p>
  <div class="btn-toggle" data-billing="toggle">
    <div class="btn-toggle__toggle">
      <div class="btn-toggle__toggle-dot" data-billing="dot"></div>
    </div>
    <input type="checkbox" class="btn-toggle__checkbox">
  </div>
  <p data-billing="label-quarterly">Quarterly</p>
</div>
<div data-billing="prices">
  <div data-billing="annual">
    <p class="price">£80</p>
    <p class="billing-caption">per month, billed annually</p>
  </div>
  <div data-billing="quarterly">
    <p class="price">£100</p>
    <p class="billing-caption">per month, billed quarterly</p>
  </div>
</div>
