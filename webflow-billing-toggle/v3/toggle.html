<div data-toggle-init data-billing="toggle" class="toggle-switch"
     role="group" aria-label="Billing period">
  <div data-toggle-bg aria-hidden="true" class="toggle-switch__bg"></div>

  <button type="button" data-toggle-btn="annual" data-toggle-active
          aria-pressed="true" class="toggle-switch__btn">
    <span>Yearly</span>
  </button>

  <button type="button" data-toggle-btn="quarterly"
          aria-pressed="false" tabindex="-1" class="toggle-switch__btn">
    <span>Quarterly</span>
  </button>
</div>
